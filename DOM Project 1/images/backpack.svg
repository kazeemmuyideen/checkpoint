<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="backpack-title">
  <title id="backpack-title">Tan leather backpack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="44" fill="url(#bg)"/>
  <circle cx="330" cy="84" r="56" fill="#fed7aa" opacity=".7"/>
  <circle cx="66" cy="318" r="44" fill="#ffffff" opacity=".6"/>
  <ellipse cx="200" cy="340" rx="118" ry="16" fill="#fdba74" opacity=".6"/>

  <!-- straps -->
  <path d="M152 178c-26 10-42 34-42 62v56" fill="none" stroke="#b45309" stroke-width="16" stroke-linecap="round" opacity=".35"/>
  <path d="M248 178c26 10 42 34 42 62v56" fill="none" stroke="#b45309" stroke-width="16" stroke-linecap="round" opacity=".35"/>

  <!-- handle -->
  <path d="M168 132c0-28 14-48 32-48s32 20 32 48" fill="none" stroke="#b45309" stroke-width="15" stroke-linecap="round"/>

  <!-- body -->
  <rect x="116" y="118" width="168" height="200" rx="44" fill="url(#body)"/>

  <!-- flap -->
  <path d="M116 172c0-30 24-54 54-54h60c30 0 54 24 54 54v18c0 14-11 25-25 25H141c-14 0-25-11-25-25z" fill="#d97706"/>
  <path d="M134 172c0-20 16-36 36-36h60c20 0 36 16 36 36" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity=".65" stroke-dasharray="2 9"/>

  <!-- buckle -->
  <rect x="182" y="188" width="36" height="48" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="5"/>
  <rect x="192" y="200" width="16" height="24" rx="5" fill="#b45309"/>
  <rect x="188" y="182" width="24" height="16" rx="6" fill="#92400e"/>

  <!-- front pocket -->
  <rect x="144" y="234" width="112" height="58" rx="18" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
  <path d="M162 252h76" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- side seams -->
  <path d="M130 214v72M270 214v72" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" opacity=".3"/>
</svg>
