<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="sneaker-title">
  <title id="sneaker-title">Classic indigo sneakers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="44" fill="url(#bg)"/>
  <circle cx="326" cy="76" r="58" fill="#c7d2fe" opacity=".55"/>
  <circle cx="70" cy="322" r="42" fill="#ffffff" opacity=".55"/>
  <ellipse cx="204" cy="336" rx="136" ry="18" fill="#a5b4fc" opacity=".55"/>

  <!-- sole -->
  <rect x="76" y="286" width="276" height="48" rx="24" fill="#f8fafc"/>
  <path d="M104 318h220" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

  <!-- upper -->
  <path d="M104 300V198c0-16 13-29 29-29h12c10 0 19 6 23 15l16 35c4 9 13 15 23 16l72 7c29 3 51 27 51 56v2H104z" fill="url(#upper)"/>

  <!-- heel tab -->
  <rect x="94" y="184" width="18" height="40" rx="9" fill="#c7d2fe"/>

  <!-- laces -->
  <g fill="none" stroke="#c7d2fe" stroke-width="7" stroke-linecap="round">
    <path d="M152 198l33 13"/>
    <path d="M147 214l36 14"/>
    <path d="M143 230l39 15"/>
  </g>

  <!-- side stripe -->
  <path d="M120 272c34-7 96-8 152 3 19 4 34 11 45 20" fill="none" stroke="#a5b4fc" stroke-width="10" stroke-linecap="round" opacity=".85"/>

  <!-- toe highlight -->
  <path d="M282 247c26 5 45 27 45 53H296c0-22-5-40-14-53z" fill="#6366f1" opacity=".45"/>

  <!-- eyelets -->
  <g fill="#eef2ff">
    <circle cx="173" cy="205" r="4"/>
    <circle cx="166" cy="222" r="4"/>
    <circle cx="161" cy="239" r="4"/>
  </g>
</svg>
