<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DOM Project 2 — an interactive color changer built with HTML, CSS and vanilla JavaScript.">
  <title>DOM Project 2 · Color Changer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Color Changer</h1>
    <p class="subtitle">Press the button to paint the box a brand-new color.</p>

    <div id="color-box">
      <span id="color-value" role="status" aria-live="polite">#6C5CE7</span>
    </div>

    <button id="change-color-btn" type="button">Change Color</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
