<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Functions Assignment</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-soft: #243449;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.12);
        --success: #4ade80;
        --border: rgba(148, 163, 184, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 40%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }

      header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      header h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #f8fafc;
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.3rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      section {
        margin-bottom: 2.5rem;
      }

      section > h2 {
        margin: 0 0 1rem;
        padding-bottom: 0.6rem;
        border-bottom: 1px solid var(--border);
        color: var(--accent);
        font-size: 1.35rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
      }

      .card {
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }

      .card h3 {
        margin: 0 0 0.35rem;
        color: #f8fafc;
        font-size: 1.05rem;
        font-family: "Consolas", "Courier New", monospace;
      }

      .card .description {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .example {
        padding: 0.65rem 0.8rem;
        border-radius: 8px;
        background: var(--surface-soft);
        font-family: "Consolas", "Courier New", monospace;
        font-size: 0.82rem;
        overflow-wrap: anywhere;
      }

      .example + .example {
        margin-top: 0.5rem;
      }

      .example .call {
        color: var(--muted);
      }

      .example .result {
        color: var(--success);
      }

      footer {
        margin-top: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
      }

      footer code {
        padding: 0.15rem 0.4rem;
        border-radius: 5px;
        background: var(--surface-soft);
        color: var(--accent);
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <span class="badge">JavaScript Assignment</span>
        <h1>Functions Playground</h1>
        <p>
          String manipulation, array helpers, and mathematical functions &mdash;
          live results generated by <code>functions.js</code>.
        </p>
      </header>

      <main id="demos"></main>

      <footer>
        Open <code>test.js</code> with Node to run the full test suite:
        <code>node js-functions/test.js</code>
      </footer>
    </div>

    <script src="functions.js"></script>
    <script>
      // Each demo shows the expression that was called and the live output.
      const demoGroups = [
        {
          title: "String Manipulation",
          items: [
            {
              name: "reverseString(str)",
              description: "Reverses a string character by character.",
              examples: [
                ['reverseString("JavaScript")', reverseString("JavaScript")],
                ['reverseString("Hello, World!")', reverseString("Hello, World!")],
              ],
            },
            {
              name: "countCharacters(str)",
              description: "Counts every character, including spaces.",
              examples: [
                ['countCharacters("hello")', countCharacters("hello")],
                ['countCharacters("Hello, World!")', countCharacters("Hello, World!")],
              ],
            },
            {
              name: "capitalizeWords(sentence)",
              description: "Capitalizes the first letter of every word.",
              examples: [
                [
                  'capitalizeWords("the quick brown fox")',
                  capitalizeWords("the quick brown fox"),
                ],
                [
                  'capitalizeWords("hello   world")',
                  capitalizeWords("hello   world"),
                ],
              ],
            },
          ],
        },
        {
          title: "Array Functions",
          items: [
            {
              name: "findMax(numbers)",
              description: "Finds the largest value in an array.",
              examples: [
                ["findMax([3, 7, 2, 9, 4])", findMax([3, 7, 2, 9, 4])],
                ["findMax([-10, -3, -25])", findMax([-10, -3, -25])],
              ],
            },
            {
              name: "findMin(numbers)",
              description: "Finds the smallest value in an array.",
              examples: [
                ["findMin([3, 7, 2, 9, 4])", findMin([3, 7, 2, 9, 4])],
                ["findMin([-10, -3, -25])", findMin([-10, -3, -25])],
              ],
            },
            {
              name: "sumArray(numbers)",
              description: "Adds up all the numbers in an array.",
              examples: [
                ["sumArray([1, 2, 3, 4, 5])", sumArray([1, 2, 3, 4, 5])],
                ["sumArray([10, -3, -2])", sumArray([10, -3, -2])],
              ],
            },
            {
              name: "filterArray(array, predicate)",
              description: "Keeps only the elements that pass a condition.",
              examples: [
                [
                  "filterArray([1, 2, 3, 4, 5, 6], (n) => n % 2 === 0)",
                  filterArray([1, 2, 3, 4, 5, 6], (n) => n % 2 === 0),
                ],
                [
                  'filterArray(["cat", "horse", "elephant"], (word) => word.length > 4)',
                  filterArray(["cat", "horse", "elephant"], (word) => word.length > 4),
                ],
              ],
            },
          ],
        },
        {
          title: "Mathematical Functions",
          items: [
            {
              name: "factorial(n)",
              description: "Calculates n! for a non-negative integer.",
              examples: [
                ["factorial(0)", factorial(0)],
                ["factorial(5)", factorial(5)],
                ["factorial(7)", factorial(7)],
              ],
            },
            {
              name: "isPrime(n)",
              description: "Returns true when a number is prime.",
              examples: [
                ["isPrime(2)", isPrime(2)],
                ["isPrime(29)", isPrime(29)],
                ["isPrime(9)", isPrime(9)],
              ],
            },
            {
              name: "fibonacci(terms)",
              description: "Generates the Fibonacci sequence up to a number of terms.",
              examples: [
                ["fibonacci(1)", fibonacci(1)],
                ["fibonacci(10)", fibonacci(10)],
              ],
            },
          ],
        },
      ];

      const container = document.getElementById("demos");

      demoGroups.forEach((group) => {
        const section = document.createElement("section");
        section.innerHTML = `<h2>${group.title}</h2>`;

        const grid = document.createElement("div");
        grid.className = "grid";

        group.items.forEach((item) => {
          const card = document.createElement("article");
          card.className = "card";

          const examples = item.examples
            .map(([call, result]) => {
              return `<div class="example"><span class="call">${call}</span> <span class="result">&rarr; ${JSON.stringify(result)}</span></div>`;
            })
            .join("");

          card.innerHTML = `
            <h3>${item.name}</h3>
            <p class="description">${item.description}</p>
            ${examples}
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    </script>
  </body>
</html>
